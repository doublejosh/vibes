<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="scripts/presentation.js?v=1754883516"></script>
    <script src="scripts/navigation.js?v=1754883516"></script>
    <script src="scripts/prompts-modal.js?v=1754883516"></script>
    <script src="scripts/docs-modal.js?v=1754883516"></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vibes Presentation</title>
    <link rel="stylesheet" href="styles/main.css?v=1754939197&nocache=true">
    <link rel="stylesheet" href="styles/slides.css?v=1754939197&nocache=true">
</head>
<body>
    <div id="presentation-container">
        <!-- Main slide container - full screen -->
        <main id="slide-container">
            <div id="current-slide" class="slide">
                <!-- Slides will be dynamically loaded here -->
            </div>
        </main>

        <!-- Navigation - bottom left corner -->
        <nav id="presentation-nav">
            <button id="prev-slide" aria-label="Previous slide">‹</button>
            <span id="slide-counter">1 / 20</span>
            <button id="next-slide" aria-label="Next slide">›</button>
            <button id="styles-toggle" aria-label="Toggle custom styles" title="Toggle custom styles on/off">styles</button>
            <button id="prompts-btn" aria-label="View prompts">prompts</button>
            <button id="readme-btn" aria-label="View README">readme</button>
            <button id="points-btn" aria-label="View POINTS">points</button>
        </nav>

        <!-- Single prompt suggestion - above navigation -->
        <div id="prompt-suggestions">
            <div class="prompt-label">Sample prompts</div>
            <div class="prompt-item" id="prompt-suggestion-1">
                <span class="prompt-text">Loading prompt...</span>
            </div>
        </div>

        <!-- Progress bar -->
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>

        <!-- Prompts Modal -->
        <div id="prompts-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Prompts history to create this</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="prompts-list">
                        <!-- Prompts will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- README Modal -->
        <div id="readme-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Project README</h2>
                    <button class="close-btn" data-modal="readme-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="readme-content" class="markdown-content">
                        <!-- README content will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- POINTS Modal -->
        <div id="points-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Development Points</h2>
                    <button class="close-btn" data-modal="points-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="points-content" class="markdown-content">
                        <!-- POINTS content will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading indicator -->
    <div id="loading" class="hidden">
        Loading presentation...
    </div>

    <!-- Scripts -->
    <script src="scripts/presentation.js?v=1754876057"></script>
    <script src="scripts/navigation.js?v=1754876057"></script>
    <script src="scripts/prompts-modal.js?v=1754876057"></script>
    <script src="scripts/docs-modal.js?v=1754876057"></script>
    <script>
        // Initialize presentation when page loads
        document.addEventListener('DOMContentLoaded', function() {
            PresentationApp.init();
        });
    </script>
</body>
</html>
