<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vibes Presentation</title>
    <link rel="stylesheet" href="styles/main.css?v=20250808">
    <link rel="stylesheet" href="styles/slides.css?v=20250808">
</head>
<body>
    <div id="presentation-container">
        <!-- Main slide container - full screen -->
        <main id="slide-container">
            <div id="current-slide" class="slide">
                <!-- Slides will be dynamically loaded here -->
            </div>
        </main>

        <!-- Navigation - bottom left corner -->
        <nav id="presentation-nav">
            <button id="prev-slide" aria-label="Previous slide">‹</button>
            <span id="slide-counter">1 / 20</span>
            <button id="next-slide" aria-label="Next slide">›</button>
            <button id="prompts-btn" aria-label="View prompts">prompts</button>
        </nav>

        <!-- Progress bar -->
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>

        <!-- Prompts Modal -->
        <div id="prompts-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Prompts history to create this</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="prompts-list">
                        <!-- Prompts will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading indicator -->
    <div id="loading" class="hidden">
        Loading presentation...
    </div>

    <!-- Scripts -->
    <script src="scripts/presentation.js?v=20250808"></script>
    <script src="scripts/navigation.js?v=20250808"></script>
    <script src="scripts/prompts-modal.js?v=20250808"></script>
    <script>
        // Initialize presentation when page loads
        document.addEventListener('DOMContentLoaded', function() {
            PresentationApp.init();
        });
    </script>
</body>
</html>
